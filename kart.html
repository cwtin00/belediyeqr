<!-- Cetinweb | İtibar QR Bilgi Kartı -->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>İtibar QR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="card-page">
  <main class="profile-wrap">
    <section class="profile-card">
      <div class="brand-badge">İTİBAR</div>
      <div class="status-icon">✓</div>
      <h1>İtibar QR</h1>
      <p class="profile-help">Bu QR kodu bir gezi / etkinlik güvenlik kartına aittir.</p>

      <div class="info-box">
        <span>Çocuk Adı Soyadı</span>
        <strong id="cardChild">-</strong>
      </div>
      <div class="info-box">
        <span>Veli Adı Soyadı</span>
        <strong id="cardParent">-</strong>
      </div>

      <a id="callBtn" class="call-btn" href="#">Veliyi Ara</a>
      <p id="phoneText" class="phone-text"></p>
      <p class="safety-text">Çocuğu güvenli bir yerde tutarak velisiyle iletişime geçiniz.</p>
    </section>
  </main>
  <script src="kart.js"></script>
</body>
</html>
